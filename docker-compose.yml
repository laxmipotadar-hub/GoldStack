version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: goldstack_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goldstack_ledger
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goldstack_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

